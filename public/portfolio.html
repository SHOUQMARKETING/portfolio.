<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>شوق. | Social Media Manager &amp; Content Creator</title>

<meta property="og:title" content="شوق. | Social Media Manager &amp; Content Creator">
<meta property="og:description" content="ملف أعمال شوق — إدارة وسائل التواصل الاجتماعي، صناعة المحتوى، وتصوير وتجربة المنتجات UGC.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500&family=Aref+Ruqaa:wght@400;700&display=swap">
<style>
:root{--bg:#F8EDEE;--tx:#4E172A;--mu:#843F54;--ac:#702039;--ln:rgba(112,32,57,.22);--hd:#F8EDEE;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#3D1222;--tx:#F8EDEE;--mu:#D9BFC6;--ac:#EBD9DD;--ln:rgba(248,237,238,.22);--hd:#3D1222}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--tx);font-size:1rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:19}
html:lang(ar) body{font-family:'IBM Plex Sans Arabic',sans-serif;line-height:1.9}
html:lang(en) body{font-family:'DM Sans',sans-serif;line-height:1.6}
html:lang(en) h1{letter-spacing:-.02em}
h1,h2,h3{font-weight:500;margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.w{max-width:1100px;margin:0 auto;padding-inline:clamp(16px,5vw,56px)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hd);border-bottom:1px solid var(--ln)}
header .w{display:flex;align-items:center;gap:20px;padding-block:10px}
.lg{font-size:1.5rem;font-weight:500;text-decoration:none}
.lgm,.lgm2{display:block;aspect-ratio:0.7812;background:var(--ac);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.lgm{height:40px}
.lgm2{height:112px;margin:24px auto 0}
.fin{text-align:center;margin:56px auto 0;max-width:30em}
#contact .fin p{margin:0 auto;max-width:none;font-size:1.0625rem;color:var(--tx)}
nav{margin-inline-start:auto;display:flex;align-items:center;gap:20px;font-size:.9375rem}
nav a{text-decoration:none}
nav a:hover{text-decoration:underline;text-underline-offset:5px}
#lb{font:inherit;font-size:.875rem;color:var(--tx);background:none;border:1px solid var(--ln);border-radius:999px;padding:4px 14px;min-height:36px;cursor:pointer}
#lb span{color:var(--mu)}
#lb[data-l=ar] span:first-child,#lb[data-l=en] span:last-child{color:var(--tx);font-weight:500}
.hero{padding-block:clamp(44px,8vw,96px) clamp(14px,2.5vw,28px)}
.rl{margin:0 0 20px;color:var(--mu);font-size:.9375rem}
h1{font-size:clamp(2.5rem,8.5vw,5.75rem);line-height:1.3;max-width:15em}
.ds{max-width:34em;margin:24px 0 32px;font-size:1.0625rem;color:var(--mu)}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px}
.bt{display:inline-block;background:#702039;color:#fff;text-decoration:none;padding:12px 26px;border-radius:12px;font-weight:500}
.bt:hover{background:#4E172A}
.lk{text-underline-offset:5px}
.lc{margin:40px 0 0;color:var(--mu);font-size:.875rem}
section{padding-block:clamp(40px,7vw,80px)}
#work{padding-top:clamp(14px,2.5vw,28px)}
h2{font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.4;margin-bottom:28px}
.rv{opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s}
.rv.v{opacity:1;transform:none}
.fd{position:relative;isolation:isolate;margin-top:-88px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 60px)}
.fd:first-child{margin-top:0}
.tx{background-color:var(--bg);background-image:repeating-linear-gradient(90deg,var(--ln) 0 1px,transparent 1px 3px),repeating-linear-gradient(0deg,var(--ln) 0 1px,transparent 1px 4px);background-attachment:fixed}
.tb{display:flex;align-items:center;gap:10px;box-sizing:border-box;min-width:30%;height:44px;margin-inline-start:calc(var(--o)*1%);margin-bottom:-1px;padding:0 18px;position:relative;z-index:1;color:var(--fg);border:0;border-radius:14px 14px 0 0;font-size:.9375rem;font-weight:500;font-family:inherit;white-space:nowrap;text-align:start;cursor:pointer}
.tb::before,.tb::after{content:"";position:absolute;bottom:0;width:14px;height:14px}
.tb::before{left:-14px;background:radial-gradient(circle at 0 0,transparent 13.5px,var(--bg) 14px)}
.tb::after{right:-14px;background:radial-gradient(circle at 100% 0,transparent 13.5px,var(--bg) 14px)}
.tb:hover .t{text-decoration:underline;text-underline-offset:5px}
.tb:focus-visible{outline:3px solid var(--fg);outline-offset:-6px}
.n{font-family:'DM Sans',sans-serif;font-size:.8125rem;direction:ltr}
.ch{margin-inline-start:auto;width:8px;height:8px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-2px,-2px);transition:transform .3s}
.open .ch{transform:rotate(-135deg)}
.bd{position:relative;color:var(--fg);border-radius:28px 28px 0 0;padding:26px 26px 90px}
.fd:last-child .bd{border-radius:28px;padding-bottom:36px}
.pk{position:absolute;top:4px;inset-inline:26px;margin:0;font-size:.8125rem;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.open .pk{display:none}
.in{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.7,.2,1)}
.open .in{grid-template-rows:1fr}
.in>div{overflow:hidden;min-height:0}
.h{font-size:clamp(1.6rem,4vw,2.25rem);line-height:1.5;margin-bottom:4px}
.d{margin:0 0 20px;font-size:.9375rem}
.g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g i,.cv{display:block;aspect-ratio:4/5;border-radius:10px;background:var(--ph);background-size:cover;background-position:center}
.g figure{margin:0;position:relative}
.g figcaption,.cp{margin:10px 0 0;font-size:.8125rem}
.rw{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--ph);font-size:.9375rem}
.rw span:last-child{font-size:.8125rem;text-align:end}
.sr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;gap:8px 32px;align-items:baseline;border-top:1px solid var(--ln);padding:24px 0}
.sr h3{font-size:1.25rem}
.sr ul{list-style:none;margin:0;padding:0;color:var(--mu)}
.sr li{display:inline}
.sr li+li::before{content:"·";margin-inline:.6em}
.sr a{text-underline-offset:5px;color:var(--ac)}
#contact p{max-width:34em;margin:0 0 12px;color:var(--mu)}
#contact .pl{font-size:.875rem;border-top:1px solid var(--ln);padding-top:16px;margin-top:24px}
#ct{position:fixed;inset-block-end:calc(env(safe-area-inset-bottom,0px) + 16px);inset-inline-start:clamp(16px,3vw,32px);z-index:15;pointer-events:none;font-family:'DM Sans',sans-serif;font-size:.8125rem;color:var(--mu);background:var(--hd);border:1px solid var(--ln);border-radius:999px;padding:2px 12px;direction:ltr}
#ct b{color:var(--tx);font-weight:500}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.wd{display:inline-block;animation:up .75s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d)}
.fd.dr{opacity:0;transform:translateY(48px);transition:opacity .6s,transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--dl,0ms)}
.fd.dr.v{opacity:1;transform:none}
#pg{position:absolute;inset-inline:0;bottom:-1px;height:3px;background:var(--ac);transform:scaleX(0);transform-origin:right;transition:none}
html[dir=ltr] #pg{transform-origin:left}
#mb{font:inherit;font-size:.875rem;font-weight:500;color:var(--bg);background:var(--tx);border:0;border-radius:999px;padding:4px 18px;min-height:36px;cursor:pointer}
#mn{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;justify-content:flex-end;overflow:auto;padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
#mn[hidden]{display:none}
#mn ul{list-style:none;margin:0;padding:0}
#mn li{position:relative;margin-top:-24px}
#mn li:first-child{margin-top:0}
#mn a{display:flex;align-items:baseline;gap:16px;padding:36px clamp(20px,5vw,56px) 52px;border-radius:28px 28px 0 0;color:var(--fg);text-decoration:none}
#mn li:last-child a{padding-bottom:calc(52px + env(safe-area-inset-bottom,0px))}
#mn a:hover .mt{text-decoration:underline;text-underline-offset:8px}
#mn a:focus-visible{outline:3px solid var(--fg);outline-offset:-8px}
#mn.o li{animation:up .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*80ms)}
.mt{font-size:clamp(2rem,7vw,4.5rem);line-height:1.3;font-weight:500}
#mx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);inset-inline-end:clamp(16px,5vw,56px);font:inherit;font-size:.875rem;color:var(--tx);background:none;border:1px solid var(--ln);border-radius:999px;padding:4px 18px;min-height:36px;cursor:pointer}
.cue{margin:28px 0 0;color:var(--mu);font-size:.8125rem;display:flex;align-items:center;gap:12px}
.cue::before{content:"";width:40px;height:1px;background:var(--ln)}
.tn{margin:0 0 12px;color:var(--mu);font-size:.875rem}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px 24px;margin:0 0 40px;padding:0;list-style:none}
.tl li{display:flex;align-items:center;gap:14px;border-top:1px solid var(--ln);padding-top:16px}
.tl{perspective:900px;position:relative}
.tl li.tk{gap:24px;padding-bottom:14px}
.tl.pre .tk{opacity:0}
@keyframes fl{to{transform:translateY(-6px)}}
.sc{flex:none;position:relative;width:72px;height:72px;perspective:560px;animation:fl 5s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-.9s)}
.sc::after{content:"";position:absolute;inset:auto 8% -14px;height:12px;border-radius:50%;background:rgba(78,23,42,.4);filter:blur(8px)}
.cb{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(16deg) rotateY(-22deg);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.tk:hover .cb{transform:rotateX(6deg) rotateY(16deg) translateZ(8px)}
.cb .ly,.cb .fc{position:absolute;inset:0;border-radius:18px}
.cb .ly{background:var(--b);filter:brightness(.7);transform:translateZ(var(--z))}
.cb .fc{background:linear-gradient(145deg,var(--a),var(--b));box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -3px 6px rgba(0,0,0,.25)}
.cb .gl{position:absolute;inset:0;display:grid;place-items:center;transform:translateZ(14px)}
.cb .gl svg{width:38px;height:38px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.tl b{display:block;font-weight:500;font-size:1rem}
.tl .r{display:block;color:var(--mu);font-size:.8125rem;line-height:1.6}
.ow{position:relative;height:clamp(400px,64vw,540px);max-width:900px;margin:0 auto}
.orb{position:absolute;inset:0;width:100%;height:100%;color:var(--mu);overflow:visible}
.rg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-dasharray:.1 7;stroke-linecap:round;opacity:.75}
.dt{fill:var(--ac)}
.sp{animation:rot 70s linear infinite}
.sp.r2{animation-duration:95s;animation-direction:reverse}
.sp.r3{animation-duration:120s}
@keyframes rot{to{transform:rotate(360deg)}}
.oc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding-inline:22%}
.oc h2{margin:0;font-size:clamp(2rem,6.5vw,3.5rem)}
#contact .oc p{margin:12px auto 0;max-width:16em;font-size:.9375rem;color:var(--mu)}
.cl{position:absolute;inset:0;margin:0;padding:0;list-style:none;perspective:900px;pointer-events:none}
.cl li{position:absolute;pointer-events:auto}
.cl li:nth-child(1){top:14%;inset-inline-start:19%}
.cl li:nth-child(2){top:14%;inset-inline-end:19%}
.cl li:nth-child(3){bottom:16%;inset-inline-start:19%}
.cl li:nth-child(4){bottom:16%;inset-inline-end:19%}
.cl.pre .tk{opacity:0}
.cl.pre.v .tk{animation:em .9s cubic-bezier(.2,.9,.25,1.15) both;animation-delay:calc(var(--i)*110ms)}
@keyframes em{from{opacity:0;transform:translateZ(-340px) translateY(70px) scale(.7);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.cl li.tk{flex:none;text-align:center;border:0;padding:0}
.cl a{display:block;text-decoration:none}
.cl .sc{width:clamp(60px,17vw,80px);height:clamp(60px,17vw,80px);margin:0 0 14px}
.cl .cb .gl svg{width:50%;height:50%}
.cl b{display:block;font-weight:500;font-size:1rem}
.cl bdi{display:block;color:var(--mu);font-size:.8125rem;overflow-wrap:anywhere}
.cl a:focus-visible{outline:2px solid var(--ac);outline-offset:8px;border-radius:12px}
#contact .hn{max-width:900px;margin:8px auto 0;text-align:end;font-size:.8125rem}
#tm{display:grid;place-items:center;width:36px;height:36px;padding:0;color:var(--tx);background:none;border:1px solid var(--ln);border-radius:50%;cursor:pointer}
.ap{background:#F8EDEE;color:#4E172A;border-radius:20px;padding:clamp(24px,5vw,44px);margin:0 auto 20px;max-width:760px}
.ap p{margin:0;font-size:clamp(1rem,2.4vw,1.1875rem);line-height:1.85;text-align:justify;text-align-last:center;text-wrap:pretty}
.ap p:last-child{margin:0}
.hl{color:#702039;font-weight:500}
.pm{margin:36px 0 8px;text-align:center;font-family:'Aref Ruqaa','IBM Plex Sans Arabic',serif}
.pm p{margin:0;font-size:clamp(1.5rem,4.2vw,2.25rem);line-height:2}
.pm .pa{margin-top:12px;font-size:1rem;opacity:.85}
#contact .fin p{font-size:clamp(1.75rem,5vw,3rem);line-height:1.6;font-weight:500;color:#5C1B30;text-shadow:1px 1px 0 #3A0F1E,2px 3px 4px rgba(53,16,28,.22)}
:root[data-theme="dark"] #contact .fin p{color:#F8EDEE;text-shadow:1px 1px 0 #CCABB4,2px 3px 4px rgba(0,0,0,.35)}
.fin{margin-top:clamp(48px,9vw,96px);perspective:900px}
.fin.pre>*{opacity:0}
.fin.pre.v>*{animation:em .9s cubic-bezier(.2,.9,.25,1.15) both}
.fin.pre.v>i{animation-delay:.25s}
.fin.pre.v>p{animation:em .9s cubic-bezier(.2,.9,.25,1.15) both,fl 5s ease-in-out .9s infinite alternate}
.lgm2{filter:drop-shadow(0 10px 10px rgba(53,16,28,.3))}

.fd-hd{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px;margin-bottom:20px}
.fd-hd .d{margin:0}
.cv-wrap{position:relative;display:block;width:100%;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--ph);border:0;padding:0;cursor:pointer;text-align:start}
.cv-wrap img,.cv-wrap video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.cv-wrap:hover img,.cv-wrap:hover video{transform:scale(1.03)}
.cv-split{display:grid;width:100%;height:100%;gap:3px;background:var(--bg)}
.cv-split.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cv-split.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cv-split video{width:100%;height:100%;object-fit:cover;display:block}
.cv-bento{display:grid;width:100%;height:100%;gap:3px;background:var(--bg);grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}
.cv-bento-item{position:relative;overflow:hidden;width:100%;height:100%;background:var(--ph)}
.cv-bento-item img,.cv-bento-item video{width:100%;height:100%;object-fit:cover;display:block}
.cv-bento-play{position:absolute;top:6px;inset-inline-start:6px;width:20px;height:20px;border-radius:999px;background:rgba(61,18,34,.75);color:#F8EDEE;display:grid;place-items:center;font-size:.58rem;line-height:1;backdrop-filter:blur(4px)}
.cv-bento.b5 .cv-bento-item:nth-child(1){grid-column:1 / span 2;grid-row:1 / span 2}
.cv-bento.b5 .cv-bento-item:nth-child(2){grid-column:1 / span 1;grid-row:3 / span 1}
.cv-bento.b5 .cv-bento-item:nth-child(3){grid-column:2 / span 1;grid-row:3 / span 1}
.cv-bento.b5 .cv-bento-item:nth-child(4){grid-column:3 / span 2;grid-row:1 / span 1}
.cv-bento.b5 .cv-bento-item:nth-child(5){grid-column:3 / span 2;grid-row:2 / span 2}
.cv-bento.b4 .cv-bento-item:nth-child(1){grid-column:1 / span 2;grid-row:1 / span 2}
.cv-bento.b4 .cv-bento-item:nth-child(2){grid-column:1 / span 2;grid-row:3 / span 1}
.cv-bento.b4 .cv-bento-item:nth-child(3){grid-column:3 / span 2;grid-row:1 / span 1}
.cv-bento.b4 .cv-bento-item:nth-child(4){grid-column:3 / span 2;grid-row:2 / span 2}
.cv-bento.b3 .cv-bento-item:nth-child(1){grid-column:1 / span 2;grid-row:1 / span 3}
.cv-bento.b3 .cv-bento-item:nth-child(2){grid-column:3 / span 2;grid-row:1 / span 2}
.cv-bento.b3 .cv-bento-item:nth-child(3){grid-column:3 / span 2;grid-row:3 / span 1}
.cv-bento.b2{grid-template-rows:repeat(5,minmax(0,1fr))}
.cv-bento.b2 .cv-bento-item:nth-child(1){grid-column:1 / span 4;grid-row:1 / span 3}
.cv-bento.b2 .cv-bento-item:nth-child(2){grid-column:1 / span 4;grid-row:4 / span 2}
.cv-badge{position:absolute;top:10px;inset-inline-start:10px;display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:8px;background:rgba(61,18,34,.78);color:#F8EDEE;font-size:.75rem;line-height:1.4;backdrop-filter:blur(6px)}
.cv-open-btn{position:absolute;bottom:10px;inset-inline-start:10px;display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:rgba(61,18,34,.82);color:#F8EDEE;font-size:.75rem;line-height:1.2;backdrop-filter:blur(6px);border:1px solid rgba(248,237,238,.25);transition:transform .2s,background-color .2s}
.cv-wrap:hover .cv-open-btn{background:rgba(61,18,34,.96);transform:scale(1.04)}
.cv-cnt{position:absolute;bottom:10px;inset-inline-end:10px;padding:2px 8px;border-radius:8px;background:rgba(61,18,34,.78);color:#F8EDEE;font-size:.75rem;line-height:1.4;backdrop-filter:blur(6px)}
.ugc-links-row{display:grid;gap:6px;margin-top:8px}
.ugc-links-row.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.ugc-links-row.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ugc-clip-slot{display:flex;justify-content:center}
.ugc-clip-link{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:999px;color:var(--fg);border:1px solid currentColor;text-decoration:none;opacity:.85;transition:opacity .2s,background-color .2s,transform .2s}
.ugc-clip-link:hover{opacity:1;background:var(--ph);transform:translateY(-1px)}

.sh-modal-backdrop{position:fixed;inset:0;z-index:50;background:rgba(42,11,22,.76);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,32px)}
.sh-modal-backdrop[hidden]{display:none}
.sh-modal{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:24px;width:100%;max-width:860px;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(34,9,18,.35)}
.sh-modal.wide{max-width:1020px}
.sh-modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 24px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:2}
.sh-modal-head h3{font-size:1.125rem;font-weight:500}
.sh-close{font:inherit;font-size:.875rem;color:var(--tx);background:none;border:1px solid var(--ln);border-radius:999px;padding:4px 16px;min-height:34px;cursor:pointer}
.sh-close:hover{border-color:var(--ac)}
.sh-modal-body{padding:24px}
.sh-stage{position:relative;background:#260A14;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:300px;max-height:62vh}
.sh-stage img,.sh-stage video{max-width:100%;max-height:62vh;width:auto;height:auto;display:block;object-fit:contain}

function wk(){
  const ui=T[lang].ui;
  document.querySelectorAll('[data-p]').forEach(el=>{
    const sec=el.dataset.p;
    const list=PROJECTS.filter(p=>p.section===sec);
    if(!list.length){el.innerHTML='<i></i><i></i><i></i>';return;}
    el.innerHTML=list.map(project=>{
      const cover=project.media[0];
      const videos=project.media.filter(m=>m.type==='video');
      const hasMultiVideos=videos.length>1;
      const isSocial=sec==='social';
      const isContent=sec==='content';
      const isUgc=sec==='ugc';
      const showBento=isContent&&project.media.length>1;
      const bento=showBento?project.media.slice(0,5):[];
      const title=isUgc?'':(project.title[lang]||project.title.ar||project.title.en);
      const socialLogo=isSocial?(project.coverLogo||(cover.type==='image'?cover.url:'')):'';
      const ugcLinks=isUgc?(hasMultiVideos?videos.slice(0,3):(cover.type==='video'?[cover]:[])):[];
      const hasAnyLink=ugcLinks.some(v=>!!v.link);

      let inner='';
      if(isSocial&&socialLogo){
        inner=`<img src="${esc(socialLogo)}" alt="${esc(title)}" loading="lazy">`;
      }else if(showBento){
        inner=`<div class="cv-bento b${bento.length}">`+bento.map(item=>`<div class="cv-bento-item">${item.type==='video'?`<video src="${esc(item.url)}" muted playsinline loop preload="metadata"></video><span class="cv-bento-play" aria-hidden="true">▶</span>`:`<img src="${esc(item.url)}" alt="" loading="lazy">`}</div>`).join('')+`</div>`;
      }else if(hasMultiVideos){
        inner=`<div class="cv-split ${videos.length===2?'n2':'n3'}">`+videos.slice(0,3).map(v=>`<video src="${esc(v.url)}" muted playsinline loop preload="metadata"></video>`).join('')+`</div>`;
      }else if(cover.type==='video'){
        inner=`<video src="${esc(cover.url)}" muted playsinline loop preload="metadata"></video>`;
      }else{
        inner=`<img src="${esc(cover.url)}" alt="${esc(title)}" loading="lazy">`;
      }

      const badge=isSocial
        ?`<span class="cv-open-btn" aria-hidden="true">${OPEN_SVG}${esc(ui.openWorks)}</span>`
        :(!showBento&&(cover.type==='video'||hasMultiVideos)?`<span class="cv-badge" aria-hidden="true">▶ ${esc(ui.videoBadge)}</span>`:'');
      const cnt=project.media.length>1?`<span class="cv-cnt" aria-hidden="true">${esc(ui.photosVideosCount(project.media.length))}</span>`:'';
      const cap=!isUgc&&title?`<figcaption>${esc(title)}</figcaption>`:'';
      const clips=isUgc&&hasAnyLink?`<div class="ugc-links-row ${ugcLinks.length===2?'n2':ugcLinks.length>=3?'n3':''}">`+ugcLinks.map(v=>`<div class="ugc-clip-slot">${v.link?`<a href="${esc(v.link)}" target="_blank" rel="noopener noreferrer" class="ugc-clip-link" aria-label="${esc(ui.openVideoLink)}" title="${esc(v.link)}">${CLIP_SVG}</a>`:''}</div>`).join('')+`</div>`:'';

      return `<figure><button type="button" class="cv-wrap" data-pid="${esc(project.id)}" aria-label="${esc(title)}">${inner}${badge}${cnt}</button>${cap}${clips}</figure>`;
    }).join('');
  });
}

fl.addEventListener('mouseenter',e=>{
  const btn=e.target.closest&&e.target.closest('.cv-wrap');
  if(btn)btn.querySelectorAll('video').forEach(v=>v.play().catch(()=>{}));
},true);
fl.addEventListener('mouseleave',e=>{
  const btn=e.target.closest&&e.target.closest('.cv-wrap');
  if(btn)btn.querySelectorAll('video').forEach(v=>{v.pause();v.currentTime=0;});
},true);

const lbEl=document.getElementById('sh-lb');
function renderLightbox(){
  if(!activeProject){lbEl.hidden=true;lbEl.innerHTML='';return;}
  const p=activeProject;
  const ui=T[lang].ui;
  const secIdx=F.findIndex(f=>f.id===p.section);
  const secTitle=(T[lang].f[secIdx]&&T[lang].f[secIdx][1])||'';
  const isUgc=p.section==='ugc';
  const videos=p.media.filter(m=>m.type==='video');
  const images=p.media.filter(m=>m.type==='image');
  const multiVideo=videos.length>1;
  const title=isUgc?'':(p.title[lang]||p.title.ar||p.title.en);
  const desc=isUgc?'':(p.description[lang]||p.description.ar||p.description.en);
  const gridCls=videos.length===2?'c2':videos.length>=3?'c3':'';

  let bodyHtml='';
  if(multiVideo){
    bodyHtml=`<div class="sh-videos-grid ${gridCls}">`+videos.map(vid=>`<div class="sh-video-col"><div class="sh-video-cell"><video src="${esc(vid.url)}" controls playsinline preload="metadata"></video></div>${isUgc&&vid.link?`<a href="${esc(vid.link)}" target="_blank" rel="noopener noreferrer" class="sh-modal-clip" aria-label="${esc(ui.openVideoLink)}" title="${esc(vid.link)}">${CLIP_SVG}</a>`:''}</div>`).join('')+`</div>`;
    if(images.length){
      bodyHtml+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:14px">`+images.map(img=>`<div style="border-radius:12px;overflow:hidden;background:#260A14;aspect-ratio:4/5"><img src="${esc(img.url)}" alt="${esc(title||secTitle)}" style="width:100%;height:100%;object-fit:cover;display:block"></div>`).join('')+`</div>`;
    }
  }else{
    const cur=p.media[activeIdx]||p.media[0];
    const hasMult=p.media.length>1;
    bodyHtml=`<div class="sh-stage">${cur.type==='video'?`<video src="${esc(cur.url)}" controls autoplay playsinline></video>`:`<img src="${esc(cur.url)}" alt="${esc(title||secTitle)}">`}${hasMult?`<button type="button" class="sh-nav-btn prev" aria-label="${esc(ui.prev)}">${lang==='ar'?'›':'‹'}</button><button type="button" class="sh-nav-btn next" aria-label="${esc(ui.next)}">${lang==='ar'?'‹':'›'}</button>`:''}</div>`;
    if(isUgc&&cur.type==='video'&&cur.link){
      bodyHtml+=`<div style="display:flex;justify-content:center;margin-top:12px"><a href="${esc(cur.link)}" target="_blank" rel="noopener noreferrer" class="sh-modal-clip" aria-label="${esc(ui.openVideoLink)}" title="${esc(cur.link)}">${CLIP_SVG}</a></div>`;
    }
    if(hasMult){
      bodyHtml+=`<div class="sh-thumbs">`+p.media.map((it,idx)=>`<button type="button" class="sh-thumb ${idx===activeIdx?'active':''}" data-tidx="${idx}" aria-label="${idx+1}">${it.type==='video'?`<video src="${esc(it.url)}" muted playsinline preload="metadata"></video>`:`<img src="${esc(it.url)}" alt="">`}</button>`).join('')+`</div>`;
    }
  }
  if(desc){
    bodyHtml+=`<p style="margin:16px 0 0;color:var(--mu);font-size:.9375rem;line-height:1.75">${esc(desc)}</p>`;
  }

  lbEl.innerHTML=`<div class="sh-modal ${multiVideo?'wide':''}"><div class="sh-modal-head"><div><span style="font-size:.75rem;color:var(--mu);display:block">${esc(secTitle)}</span>${title?`<h3>${esc(title)}</h3>`:''}</div><button type="button" class="sh-close" id="sh-close-btn">${esc(ui.close)}</button></div><div class="sh-modal-body">${bodyHtml}</div></div>`;
  lbEl.setAttribute('aria-label',title||secTitle);
  lbEl.hidden=false;
}
function closeLightbox(){activeProject=null;renderLightbox();}
lbEl.addEventListener('click',e=>{
  if(e.target===lbEl||e.target.closest('#sh-close-btn')){closeLightbox();return;}
  if(e.target.closest('.sh-nav-btn.prev')&&activeProject){activeIdx=(activeIdx-1+activeProject.media.length)%activeProject.media.length;renderLightbox();return;}
  if(e.target.closest('.sh-nav-btn.next')&&activeProject){activeIdx=(activeIdx+1)%activeProject.media.length;renderLightbox();return;}
  const th=e.target.closest('.sh-thumb');
  if(th&&activeProject){activeIdx=Number(th.dataset.tidx)||0;renderLightbox();}
});

function sv(){document.getElementById('sv').innerHTML=T[lang].sv.map((s,i)=>'<article class="sr"><h3>'+s[0]+'</h3><ul>'+s[1].map(x=>'<li>'+x+'</li>').join('')+'</ul><a href="#'+SV[i]+'">'+T[lang].sl+'</a></article>').join('');}
function ts(){const tl=document.getElementById('tl');if(!tl.dataset.r){tl.dataset.r=1;tl.innerHTML=TOOLS.map((x,i)=>'<li class="tk" style="--i:'+i+';--a:'+x.a+';--b:'+x.b+'"><div class="sc"><div class="cb"><i class="ly" style="--z:-5px"></i><i class="ly" style="--z:-10px"></i><i class="ly" style="--z:-15px"></i><i class="ly" style="--z:-20px"></i><div class="fc"></div><div class="gl"><svg viewBox="0 0 48 48" aria-hidden="true">'+x.g+'</svg></div></div></div><div><b>'+x.n+'</b><span class="r" data-r="'+i+'"></span></div></li>').join('');}tl.querySelectorAll('[data-r]').forEach(e=>{e.textContent=TOOLS[e.dataset.r].r[lang];});}
function cs(){const cl=document.getElementById('cl');if(!cl.dataset.r){cl.dataset.r=1;cl.innerHTML=CT.map((c,i)=>'<li class="tk" style="--i:'+i+';--a:'+c.a+';--b:'+c.b+'"><a href="'+c.u+'" target="_blank" rel="noopener" data-c="'+i+'"><div class="sc"><div class="cb"><i class="ly" style="--z:-5px"></i><i class="ly" style="--z:-10px"></i><i class="ly" style="--z:-15px"></i><i class="ly" style="--z:-20px"></i><div class="fc"></div><div class="gl"><svg viewBox="0 0 48 48" aria-hidden="true">'+c.g+'</svg></div></div></div></a></li>').join('');}cl.querySelectorAll('[data-c]').forEach(e=>{e.setAttribute('aria-label',CT[e.dataset.c].n[lang]);});}

function sl(l){
  lang=l;const h=document.documentElement;h.lang=l;h.dir=l==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-k]').forEach(e=>{e.textContent=g(e.dataset.k);});
  document.querySelector('h1').innerHTML=g('tag').split(' ').map((w,i)=>'<span class="wd" style="--d:'+i*90+'ms">'+w+'</span>').join(' ');
  sv();wk();ts();cs();
  document.getElementById('abp').innerHTML='<p>'+T[lang].abp.map(p=>'<span class="ps">'+p.replace(/\*(.+?)\*/g,'<span class="hl">$1</span>')+'</span>').join(' ')+'</p>';
  document.getElementById('lb').dataset.l=l;
  document.title=l==='ar'?'شوق. | Social Media Manager & Content Creator':'Shouq. | Social Media Manager & Content Creator';
  if(activeProject)renderLightbox();
}
const mq=matchMedia('(prefers-reduced-motion:reduce)');
function tg(id,force,quiet){
  const el=document.getElementById(id);if(!el)return;
  const on=force===undefined?!el.classList.contains('open'):force;
  document.querySelectorAll('.fd').forEach(x=>{const o=x===el&&on;x.classList.toggle('open',o);x.querySelector('.tb').setAttribute('aria-expanded',o);x.querySelector('.in').inert=!o;});
  if(quiet)return;
  if(on)setTimeout(()=>el.scrollIntoView({behavior:mq.matches?'auto':'smooth',block:'start'}),mq.matches?0:480);
}
fl.addEventListener('click',e=>{
  const cv=e.target.closest('.cv-wrap');
  if(cv){const proj=PROJECTS.find(p=>p.id===cv.dataset.pid);if(proj){activeProject=proj;activeIdx=0;renderLightbox();}return;}
  if(e.target.closest('a.ugc-clip-link'))return;
  const f=e.target.closest('.fd');if(!f)return;
  if(e.target.closest('.tb')||!f.classList.contains('open'))tg(f.id);
});
fl.addEventListener('keydown',e=>{if(!e.target.classList.contains('tb'))return;const t=[...fl.querySelectorAll('.tb')],i=t.indexOf(e.target),d=e.key==='ArrowDown'?1:e.key==='ArrowUp'?-1:0;if(d){e.preventDefault();t[(i+d+t.length)%t.length].focus();}});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(F.some(f=>f.id===id))tg(id,true);});
document.getElementById('lb').addEventListener('click',()=>{sl(lang==='ar'?'en':'ar');uc();});
sl('ar');
if('scrollRestoration' in history)history.scrollRestoration='manual';
if(location.hash){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
scrollTo(0,0);addEventListener('load',()=>setTimeout(()=>scrollTo(0,0),60));
tg('about',true,true);
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('v');io.unobserve(e.target);}}));
document.querySelectorAll('h2').forEach(h=>{h.classList.add('rv');io.observe(h);});
const fio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('v');fio.unobserve(e.target);}}),{threshold:.05});
document.querySelectorAll('.fd').forEach((f,i)=>{f.style.setProperty('--dl',i*90+'ms');f.classList.add('dr');fio.observe(f);});
const mn=document.getElementById('mn'),mb=document.getElementById('mb');
function mo(o){mn.hidden=!o;document.body.style.overflow=o?'hidden':'';mb.setAttribute('aria-expanded',o);if(o){mn.classList.remove('o');void mn.offsetWidth;mn.classList.add('o');mn.querySelector('a').focus();}else mb.focus();}
mb.addEventListener('click',()=>mo(true));
document.getElementById('mx').addEventListener('click',()=>mo(false));
mn.addEventListener('click',e=>{if(e.target.closest('a'))mo(false);});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(activeProject){closeLightbox();return;}
    if(!mn.hidden){mo(false);return;}
  }
  if(activeProject&&activeProject.media.length>1){
    if(e.key==='ArrowRight'){activeIdx=lang==='ar'?(activeIdx-1+activeProject.media.length)%activeProject.media.length:(activeIdx+1)%activeProject.media.length;renderLightbox();}
    else if(e.key==='ArrowLeft'){activeIdx=lang==='ar'?(activeIdx+1)%activeProject.media.length:(activeIdx-1+activeProject.media.length)%activeProject.media.length;renderLightbox();}
  }
});
const pg=document.getElementById('pg');
function pr(){const m=document.documentElement.scrollHeight-innerHeight;pg.style.transform='scaleX('+(m>0?Math.min(scrollY/m,1):0)+')';}
addEventListener('scroll',pr,{passive:true});pr();
const LS=[document.getElementById('tl')],cm=document.getElementById('cl');
if(!mq.matches){LS.forEach(l=>l.classList.add('pre'));cm.classList.add('pre');new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('v',e.isIntersecting)),{threshold:.2}).observe(cm);}
function tp(){if(mq.matches)return;const vh=innerHeight;LS.forEach(L=>{const b=L.getBoundingClientRect().top;L.querySelectorAll('.tk').forEach((t,i)=>{let p=Math.min(1,Math.max(0,(vh*.92-b-i*60)/(vh*.38)));p=Math.max(+t.dataset.p||0,p);t.dataset.p=p;const q=1-p;t.style.opacity=p;t.style.transform='translateZ('+(-340*q)+'px) translateY('+(70*q)+'px) scale('+(.7+.3*p)+')';t.style.filter=q>.01?'blur('+(10*q)+'px)':'none';});});}
addEventListener('scroll',tp,{passive:true});addEventListener('resize',tp);tp();
const SC=['hero','work','services','tools','contact'],ct=document.getElementById('ct');
let ci=0;
function uc(){ct.innerHTML='<b>0'+(ci+1)+'</b> / 0'+SC.length+' · <bdi>'+['شوق.',g('nw'),g('ns'),g('th'),g('nc')][ci]+'</bdi>';}
const co=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){ci=SC.indexOf(e.target.id);uc();}}),{rootMargin:'-45% 0px -50% 0px'});
uc();
SC.forEach(i=>co.observe(document.getElementById(i)));
const tm=document.getElementById('tm'),IC='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">',MN=IC+'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',SN=IC+'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
tm.innerHTML=MN;
tm.addEventListener('click',()=>{const d=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=d?'dark':'light';tm.setAttribute('aria-pressed',d);tm.innerHTML=d?SN:MN;});
const fn=document.querySelector('.fin');if(!mq.matches){fn.classList.add('pre');new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('v',e.isIntersecting)),{threshold:.3}).observe(fn);}
</script>
